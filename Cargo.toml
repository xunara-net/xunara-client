[package]
name = "xunara-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Minimal Linux mesh and subnet router for Xunara"
repository = "https://github.com/xunara-net/xunara-client"
publish = false

[dependencies]
anyhow = "1"
base64 = "=0.22.1"
boringtun = { version = "=0.7.1", default-features = false }
bytes = "1"
crypto_box = { version = "0.9", features = ["std"] }
h2 = "0.4"
hex = "0.4"
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"] }
hickory-net = { version = "=0.26.3", default-features = false, features = ["tokio", "dnssec-ring"] }
futures-util = "0.3"
http = "1"
httparse = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ipnet = { version = "2", features = ["serde"] }
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smoltcp = { version = "=0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-udp", "socket-tcp", "iface-max-addr-count-8"] }
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync", "signal", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
ts_capabilityversion = "=0.6.1"
ts_control_noise = "=0.6.1"
ts_keys = "=0.6.1"
url = "2"
webpki-roots = "1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
rcgen = "=0.14.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
